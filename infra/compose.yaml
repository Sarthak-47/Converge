services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-converge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-converge}
      POSTGRES_DB: ${POSTGRES_DB:-converge}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  collab:
    build:
      context: ..
      dockerfile: apps/collab/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-converge}:${POSTGRES_PASSWORD:-converge}@postgres:5432/${POSTGRES_DB:-converge}
      REDIS_URL: redis://redis:6379
      API_URL: http://api:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      COLLAB_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-converge}
      DATABASE_USER: ${POSTGRES_USER:-converge}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-converge}
      REDIS_HOST: redis
      COLLAB_URL: http://collab:1234
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      collab:
        condition: service_healthy

  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - api
      - collab

volumes:
  postgres-data:
