services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-converge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-converge}
      POSTGRES_DB: ${POSTGRES_DB:-converge}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  collab:
    build:
      context: ..
      dockerfile: apps/collab/Dockerfile
    environment:
      # COLLAB_DB_HOST/PORT route the database connection through Toxiproxy in the chaos profile.
      DATABASE_URL: postgres://${POSTGRES_USER:-converge}:${POSTGRES_PASSWORD:-converge}@${COLLAB_DB_HOST:-postgres}:${COLLAB_DB_PORT:-5432}/${POSTGRES_DB:-converge}
      REDIS_URL: redis://redis:6379
      API_URL: http://api:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      COLLAB_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8000}
      # true when running several instances (docker compose up --scale collab=2): documents and commands are
      # shared through Redis.
      COLLAB_CLUSTER: ${COLLAB_CLUSTER:-false}
      # Spans go to this OTLP/HTTP endpoint when set (design §16.3); see the tracing profile below.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
        required: false

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-converge}
      DATABASE_USER: ${POSTGRES_USER:-converge}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-converge}
      REDIS_HOST: redis
      COLLAB_URL: ${API_COLLAB_URL:-http://collab:1234}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      AGENT_RUNNER_URL: http://agent-runner:4100
      GIT_ALLOW_INSECURE_REMOTES: ${GIT_ALLOW_INSECURE_REMOTES:-false}
      RATE_LIMIT_SCALE: ${RATE_LIMIT_SCALE:-1}
      SECRETS_KEY: ${SECRETS_KEY:-ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXRzLWtleS0zMiE=}
      # Spans go to this OTLP/HTTP endpoint when set (design §16.3); see the tracing profile below.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      collab:
        condition: service_healthy

  # Runs agent turns on the Claude API (design §13.4). Members' own keys arrive per turn from the API.
  agent-runner:
    build:
      context: ..
      dockerfile: apps/agent-runner/Dockerfile
    environment:
      API_URL: http://api:8080
      COLLAB_WS_URL: ws://collab:1234
      COLLAB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      # Empty means the real Claude API. The end-to-end tests point it at the scripted fake model.
      ANTHROPIC_BASE_URL: ${AGENT_MODEL_URL:-}
      # Spans go to this OTLP/HTTP endpoint when set (design §16.3); see the tracing profile below.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      collab:
        condition: service_healthy

  # Runs approved jobs in sandbox containers (design §11). The only service with the Docker socket; it
  # re-checks every job's approval itself before running it (design §13.7).
  executor:
    build:
      context: ..
      dockerfile: apps/executor/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-converge}:${POSTGRES_PASSWORD:-converge}@postgres:5432/${POSTGRES_DB:-converge}
      API_URL: http://api:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-node:24-alpine}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      # Server-side Git (design §10): the stored credential is opened with the API's secrets key.
      SECRETS_KEY: ${SECRETS_KEY:-ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXRzLWtleS0zMiE=}
      GITHUB_API_URL: ${CONVERGE_GITHUB_API_URL:-https://api.github.com}
      GIT_ROOT: /var/lib/converge-git
      # Spans go to this OTLP/HTTP endpoint when set (design §16.3); see the tracing profile below.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - git-data:/var/lib/converge-git
    # The API applies the database migrations; until it has, the executor exits and is restarted.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # Scripted stand-in for the Claude API, for tests only:
  #   COMPOSE_PROFILES=fake-model AGENT_MODEL_URL=http://fake-model:9100 docker compose up -d
  fake-model:
    profiles: [fake-model]
    build:
      context: ..
      dockerfile: apps/agent-runner/Dockerfile
    command: ["node", "dist/testing/fakeModelMain.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stand-in for GitHub (git smart HTTP + the pull-request API), for tests only:
  #   COMPOSE_PROFILES=fake-github GIT_ALLOW_INSECURE_REMOTES=true CONVERGE_GITHUB_API_URL=http://fake-github:9200/api
  fake-github:
    profiles: [fake-github]
    build:
      context: ..
      dockerfile: apps/executor/Dockerfile
    command: ["node", "dist/testing/fakeGithubMain.js"]
    environment:
      FAKE_GITHUB_TOKEN: ${FAKE_GITHUB_TOKEN:-ghp_fake_token_for_tests}
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9200/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fault injection between services (design §22.6), for the chaos tests only:
  #   COMPOSE_PROFILES=chaos COLLAB_DB_HOST=toxiproxy COLLAB_DB_PORT=15432 API_COLLAB_URL=http://toxiproxy:11234
  toxiproxy:
    profiles: [chaos]
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"

  # Traces from every service, for development (design §16.3); the UI is on http://localhost:16686.
  #   COMPOSE_PROFILES=tracing OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose up -d
  jaeger:
    profiles: [tracing]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - api
      - collab

volumes:
  postgres-data:
  git-data:
