services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-converge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-converge}
      POSTGRES_DB: ${POSTGRES_DB:-converge}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  collab:
    build:
      context: ..
      dockerfile: apps/collab/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-converge}:${POSTGRES_PASSWORD:-converge}@postgres:5432/${POSTGRES_DB:-converge}
      REDIS_URL: redis://redis:6379
      API_URL: http://api:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      COLLAB_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-converge}
      DATABASE_USER: ${POSTGRES_USER:-converge}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-converge}
      REDIS_HOST: redis
      COLLAB_URL: http://collab:1234
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      AGENT_RUNNER_URL: http://agent-runner:4100
      SECRETS_KEY: ${SECRETS_KEY:-ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXRzLWtleS0zMiE=}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      collab:
        condition: service_healthy

  # Runs agent turns on the Claude API (design §13.4). Members' own keys arrive per turn from the API.
  agent-runner:
    build:
      context: ..
      dockerfile: apps/agent-runner/Dockerfile
    environment:
      API_URL: http://api:8080
      COLLAB_WS_URL: ws://collab:1234
      COLLAB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      # Empty means the real Claude API. The end-to-end tests point it at the scripted fake model.
      ANTHROPIC_BASE_URL: ${AGENT_MODEL_URL:-}
    depends_on:
      collab:
        condition: service_healthy

  # Scripted stand-in for the Claude API, for tests only:
  #   COMPOSE_PROFILES=fake-model AGENT_MODEL_URL=http://fake-model:9100 docker compose up -d
  fake-model:
    profiles: [fake-model]
    build:
      context: ..
      dockerfile: apps/agent-runner/Dockerfile
    command: ["node", "dist/testing/fakeModelMain.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - api
      - collab

volumes:
  postgres-data:
