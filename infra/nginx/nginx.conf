# One origin for everything (design §12.4): the app, the API, the STOMP socket and the
# collaboration socket. /internal endpoints are deliberately never routed.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The scheme the browser used. Behind an HTTPS proxy (production) that is the proxy's X-Forwarded-Proto, not
# nginx's own "http". Only for /api: on the socket, a scheme without a port would make the API assume port 80.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    location /internal {
        return 404;
    }

    # Metrics are for the monitoring network only (design §16); the API also requires the internal token.
    location = /api/actuator/prometheus {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Keep the port: without an allowed-origins list, the API's check compares the Origin header with Host.
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    location /collab {
        proxy_pass http://collab:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
