spring:
  application:
    name: converge-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/converge}
    username: ${DATABASE_USER:converge}
    password: ${DATABASE_PASSWORD:converge}
    # Fail fast when the database is unreachable so health checks and requests report errors
    # in seconds rather than hanging on the 30 s pool default.
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce defaults to a 60 s command timeout, which makes /health hang when Redis is down.
      connect-timeout: 2s
      timeout: 2s
  threads:
    virtual:
      enabled: true
  flyway:
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: 12h
      cookie:
        name: CONVERGE_SESSION
        http-only: true
        same-site: lax
        # Set COOKIE_SECURE=true whenever the app is served over HTTPS.
        secure: ${COOKIE_SECURE:false}

converge:
  # Shared secret for service-to-service calls on /internal/** (design §5.3). Empty refuses all of them.
  internal-token: ${INTERNAL_TOKEN:}
  collab:
    base-url: ${COLLAB_URL:http://localhost:1234}
    health:
      enabled: true

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      # Component status (UP/DOWN) is public for the status page; details such as versions are not.
      show-components: always
      show-details: never
