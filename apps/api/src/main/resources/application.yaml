spring:
  application:
    name: converge-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/converge}
    username: ${DATABASE_USER:converge}
    password: ${DATABASE_PASSWORD:converge}
    # Fail fast when the database is unreachable so health checks and requests report errors
    # in seconds rather than hanging on the 30 s pool default.
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce defaults to a 60 s command timeout, which makes /health hang when Redis is down.
      connect-timeout: 2s
      timeout: 2s
  threads:
    virtual:
      enabled: true
  flyway:
    locations: classpath:db/migration
  session:
    # Matches server.servlet.session.timeout; Spring Session keeps its own.
    timeout: 12h
    jdbc:
      # The tables come from a Flyway migration (V15), like every other table.
      initialize-schema: never

logging:
  pattern:
    # Every log line carries the request's W3C trace ID (design §16.3; see TraceContext).
    level: "%5p [trace=%X{traceId:-}]"

server:
  # nginx sets X-Forwarded-For; trusting it (from private addresses only) gives rate limits the client's address.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 12h
      cookie:
        name: CONVERGE_SESSION
        http-only: true
        same-site: lax
        # Set COOKIE_SECURE=true whenever the app is served over HTTPS.
        secure: ${COOKIE_SECURE:false}

converge:
  tracing:
    # An OTLP/HTTP endpoint (a collector, Jaeger, Tempo...) to send spans to; empty sends none (design §16.3).
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    service-name: ${OTEL_SERVICE_NAME:converge-api}
  # Shared secret for service-to-service calls on /internal/** (design §5.3). Empty refuses all of them.
  internal-token: ${INTERNAL_TOKEN:}
  # AES-256 key (base64, 32 bytes) for members' API keys and agent transcripts at rest (design §13.5).
  # Empty disables agents.
  secrets-key: ${SECRETS_KEY:}
  agent:
    runner-url: ${AGENT_RUNNER_URL:http://localhost:4100}
    # Design §13.4: Opus 5.5 with effort set explicitly (the model's own default is medium).
    model: ${AGENT_MODEL:claude-opus-5-5}
    effort: ${AGENT_EFFORT:high}
    # Hard cap per turn, in micro-dollars, enforced from recorded usage.
    cost-cap-micros: ${AGENT_COST_CAP_MICROS:2000000}
    # And per member over any 24 hours; each turn gets the smaller of the two (design §13.5).
    daily-cap-micros: ${AGENT_DAILY_CAP_MICROS:20000000}
  rate-limits:
    # Multiplies every limit; 0 turns them off. Raise it for load tests, never to 0 in production.
    scale: ${RATE_LIMIT_SCALE:1.0}
  git:
    # Only for tests against a local fake GitHub; production remotes must be https.
    allow-insecure-remotes: ${GIT_ALLOW_INSECURE_REMOTES:false}
  collab:
    base-url: ${COLLAB_URL:http://localhost:1234}
    health:
      enabled: true

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      # p50/p95/p99 for request latency, for the baseline report (design §16.1).
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  endpoint:
    health:
      # Component status (UP/DOWN) is public for the status page; details such as versions are not.
      show-components: always
      show-details: never
