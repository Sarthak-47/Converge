name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Electron's binary is fetched explicitly, and only in the job that runs the desktop app.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  api:
    name: API (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # The project keeps its Maven repository in apps/api/.m2 (see .mvn/maven.config).
      - uses: actions/cache@v6
        with:
          path: apps/api/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-
      - run: mvn -B verify

  node:
    name: Web + collab (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # npm's cache lives in .cache/npm (see .npmrc).
      - uses: actions/cache@v6
        with:
          path: .cache/npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - run: npm ci
      - run: npm run lint --workspace @converge/web
      - run: npm run typecheck
      - name: Collaboration service tests (including property tests)
        run: npm test --workspace @converge/collab
      - name: Desktop sync bridge tests (Gate F)
        run: npm test --workspace @converge/sync-bridge
      - name: Agent runner tests (edits, revert property tests, scripted model)
        run: npm test --workspace @converge/agent-runner
      - name: Executor tests (allowlist parity; Git against git http-backend; sandbox isolation, Gate C)
        run: npm test --workspace @converge/executor

  chaos:
    name: Fault injection (Toxiproxy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, node]
    env:
      COMPOSE_PROFILES: fake-model,chaos
      AGENT_MODEL_URL: http://fake-model:9100
      COLLAB_DB_HOST: toxiproxy
      COLLAB_DB_PORT: "15432"
      API_COLLAB_URL: http://toxiproxy:11234
      RATE_LIMIT_SCALE: "50"
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build
      - name: Wait for the whole stack to report UP
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/actuator/health | grep -q '"status":"UP"' && exit 0
            sleep 3
          done
          docker compose ps; docker compose logs --tail=100; exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - name: Slow and cut connections between services (design §22.6)
        run: |
          set -o pipefail
          mkdir -p .tmp
          node tests/chaos/faults.mjs | tee .tmp/faults.md
          cat .tmp/faults.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: faults
          path: |
            .tmp/faults.json
            .tmp/faults.md
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs collab | head -400; docker compose logs --tail=200
      - if: always()
        run: docker compose down -v

  stack:
    name: Compose stack + end-to-end tests
    runs-on: ubuntu-latest
    needs: [api, node]
    env:
      # Agent turns run against the scripted fake model: deterministic, free, and no key needed.
      COMPOSE_PROFILES: fake-model,fake-github
      AGENT_MODEL_URL: http://fake-model:9100
      # Git runs against the fake GitHub: real git smart HTTP and a fake pull-request API.
      GIT_ALLOW_INSECURE_REMOTES: "true"
      # Not GITHUB_API_URL: Actions defines that itself and a workflow cannot override it.
      CONVERGE_GITHUB_API_URL: http://fake-github:9200/api
      # Every end-to-end user signs up from the same address; scale the per-address limits up for the suite.
      RATE_LIMIT_SCALE: "50"
    steps:
      - uses: actions/checkout@v7
      # Two API instances behind nginx, so every realtime test also crosses instances (design §7.5).
      - run: docker compose up -d --build --scale api=2
      - name: Wait for the whole stack to report UP
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/actuator/health | tee /tmp/health.json | grep -q '"status":"UP"'; then
              cat /tmp/health.json; exit 0
            fi
            sleep 3
          done
          echo "Stack did not become healthy"; cat /tmp/health.json || true
          docker compose ps; docker compose logs --tail=100
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Prepare the desktop app (Electron binary, build, sandbox helper)
        run: |
          node apps/desktop/scripts/fetch-electron.mjs
          npm run build --workspace @converge/desktop
          # Chrome's Linux sandbox helper must be root-owned and setuid; keep the sandbox on rather than
          # running Electron with --no-sandbox.
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: End-to-end tests (gates A to F, team, presence, desktop sync, agents, sessions, approvals)
        run: xvfb-run --auto-servernum npm run e2e
      - name: Executor refuses jobs without a matching, unused approval (Gate E, live database)
        run: npm test --workspace @converge/executor -- queue
        env:
          EXECUTOR_TEST_DATABASE_URL: postgres://converge:converge@localhost:5432/converge
      - name: Desktop sync against the live stack (Gate F)
        run: npm test --workspace @converge/sync-bridge -- live
        env:
          CONVERGE_LIVE_URL: http://localhost:8000
      - name: One agent turn is one trace across the API and the runner (design §16.3)
        run: |
          trace=$(docker compose logs agent-runner | grep -o '"event":"TURN_STARTED"[^}]*' | grep -o '"traceId":"[0-9a-f]\{32\}"' | head -1 | cut -d'"' -f4)
          echo "runner trace: $trace"
          test -n "$trace"
          docker compose logs api | grep "Agent turn" | grep -q "trace=$trace"
          echo "The API logged the same trace when it started the turn."
      - name: Baseline load and chaos run (design §22.4, §22.6; Phase 13 report)
        run: |
          CHAOS=1 node tests/load/baseline.mjs | tee .tmp/baseline.md
          cat .tmp/baseline.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline
          path: |
            .tmp/baseline.json
            .tmp/baseline.md
          if-no-files-found: ignore
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
