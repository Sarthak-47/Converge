name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Electron's binary is fetched explicitly, and only in the job that runs the desktop app.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  api:
    name: API (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # The project keeps its Maven repository in apps/api/.m2 (see .mvn/maven.config).
      - uses: actions/cache@v6
        with:
          path: apps/api/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-
      - run: mvn -B verify

  node:
    name: Web + collab (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # npm's cache lives in .cache/npm (see .npmrc).
      - uses: actions/cache@v6
        with:
          path: .cache/npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - run: npm ci
      - run: npm run lint --workspace @converge/web
      - run: npm run typecheck
      - name: Collaboration service tests (including property tests)
        run: npm test --workspace @converge/collab
      - name: Desktop sync bridge tests (Gate F)
        run: npm test --workspace @converge/sync-bridge
      - name: Agent runner tests (edits, revert property tests, scripted model)
        run: npm test --workspace @converge/agent-runner
      - name: Executor tests (allowlist parity; sandbox isolation against the runner's Docker, Gate C)
        run: npm test --workspace @converge/executor

  stack:
    name: Compose stack + end-to-end tests
    runs-on: ubuntu-latest
    needs: [api, node]
    env:
      # Agent turns run against the scripted fake model: deterministic, free, and no key needed.
      COMPOSE_PROFILES: fake-model
      AGENT_MODEL_URL: http://fake-model:9100
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build
      - name: Wait for the whole stack to report UP
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/actuator/health | tee /tmp/health.json | grep -q '"status":"UP"'; then
              cat /tmp/health.json; exit 0
            fi
            sleep 3
          done
          echo "Stack did not become healthy"; cat /tmp/health.json || true
          docker compose ps; docker compose logs --tail=100
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Prepare the desktop app (Electron binary, build, sandbox helper)
        run: |
          node apps/desktop/scripts/fetch-electron.mjs
          npm run build --workspace @converge/desktop
          # Chrome's Linux sandbox helper must be root-owned and setuid; keep the sandbox on rather than
          # running Electron with --no-sandbox.
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: End-to-end tests (gates A to F, team, presence, desktop sync, agents, sessions, approvals)
        run: xvfb-run --auto-servernum npm run e2e
      - name: Executor refuses jobs without a matching, unused approval (Gate E, live database)
        run: npm test --workspace @converge/executor -- queue
        env:
          EXECUTOR_TEST_DATABASE_URL: postgres://converge:converge@localhost:5432/converge
      - name: Desktop sync against the live stack (Gate F)
        run: npm test --workspace @converge/sync-bridge -- live
        env:
          CONVERGE_LIVE_URL: http://localhost:8000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
