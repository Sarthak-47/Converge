name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only the desktop app needs Electron's ~100 MB binary; CI type-checks it without downloading.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  api:
    name: API (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # The project keeps its Maven repository in apps/api/.m2 (see .mvn/maven.config).
      - uses: actions/cache@v6
        with:
          path: apps/api/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-
      - run: mvn -B verify

  node:
    name: Web + collab (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # npm's cache lives in .cache/npm (see .npmrc).
      - uses: actions/cache@v6
        with:
          path: .cache/npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - run: npm ci
      - run: npm run lint --workspace @converge/web
      - run: npm run typecheck
      - name: Collaboration service tests (including property tests)
        run: npm test --workspace @converge/collab
      - name: Desktop sync bridge tests (Gate F)
        run: npm test --workspace @converge/sync-bridge

  stack:
    name: Compose stack + end-to-end tests
    runs-on: ubuntu-latest
    needs: [api, node]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build
      - name: Wait for the whole stack to report UP
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/actuator/health | tee /tmp/health.json | grep -q '"status":"UP"'; then
              cat /tmp/health.json; exit 0
            fi
            sleep 3
          done
          echo "Stack did not become healthy"; cat /tmp/health.json || true
          docker compose ps; docker compose logs --tail=100
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: End-to-end tests (gates A, B and D, team, presence)
        run: npm run e2e
      - name: Desktop sync against the live stack (Gate F)
        run: npm test --workspace @converge/sync-bridge -- live
        env:
          CONVERGE_LIVE_URL: http://localhost:8000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
