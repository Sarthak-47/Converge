name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The project keeps its Maven repository in apps/api/.m2 (see .mvn/maven.config).
      - uses: actions/cache@v4
        with:
          path: apps/api/.m2/repository
          key: maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: maven-
      - run: mvn -B verify

  node:
    name: Web + collab (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # npm's cache lives in .cache/npm (see .npmrc).
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - run: npm ci
      - run: npm run lint --workspace @converge/web
      - run: npm run typecheck

  stack:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [api, node]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build
      - name: Wait for the whole stack to report UP
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/actuator/health | tee /tmp/health.json | grep -q '"status":"UP"'; then
              cat /tmp/health.json; exit 0
            fi
            sleep 3
          done
          echo "Stack did not become healthy"; cat /tmp/health.json || true
          docker compose ps; docker compose logs --tail=100
          exit 1
      - if: always()
        run: docker compose down -v
